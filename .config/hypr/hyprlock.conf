# Source the colors generated by matugen at the top of hyprlock.conf
source = /home/arefin/.config/hypr/hyprlock-colors.conf

# --- General ---
general {
    grace = 1
    fractional_scaling = 2
    immediate_render = true
}

# --- Background ---
background {
    monitor =
    path = /home/arefin/.cache/log.png
    color = rgb(0,0,0)

    blur_size = 3
    blur_passes = 2
    noise = 0.0117
    contrast = 1.3000
    brightness = 0.6000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}

# --- Time (Hours) - 12-hour format ---
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%I") </big></b>"
    color = rgba(255, 255, 255, 1.0)
    font_size = 112
    font_family = Adwaita Sans
    shadow_passes = 0
    shadow_size = 0
    position = 0, 220
    halign = center
    valign = center
}

# --- Time (Minutes) ---
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%M") </big></b>"
    color = rgba(255, 255, 255, 1.0)
    font_size = 112
    font_family = Adwaita Sans
    shadow_passes = 0
    shadow_size = 0
    position = 0, 80
    halign = center
    valign = center
}

# --- Today (Day of week) ---
label {
    monitor =
    text = cmd[update:18000000] echo "<b><big> "$(date +'%A')" </big></b>"
    color = rgba(170, 170, 170, 1.0)
    font_size = 18
    font_family = JetBrainsMono NFM
    position = 0, -15
    halign = center
    valign = center
}

# --- Week (Date) ---
label {
    monitor =
    text = cmd[update:18000000] echo "<b> "$(date +'%d %b')" </b>"
    color = rgba(170, 170, 170, 1.0)
    font_size = 14
    font_family = JetBrainsMono Nerd Font 10
    position = 0, -40
    halign = center
    valign = center
}

# --- Weather (Parsed from Waybar Python JSON output) ---
label {
    monitor =
    text = cmd[update:1800000] python3 -c "import subprocess, json; res = subprocess.run(['python3', '/home/arefin/.config/hypr/scripts/weather.py'], capture_output=True, text=True); data = json.loads(res.stdout); print(data.get('text', 'N/A'))" 2>/dev/null || echo "󰖐 N/A"
    color = rgba(170, 170, 170, 1.0)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -75
    halign = center
    valign = center
}

# --- MPRIS Media Player (Fixed execution for playerctl) ---
label {
    monitor =
    text = cmd[update:2000] if playerctl status 2>/dev/null | grep -q "Playing"; then artist=$(playerctl metadata artist 2>/dev/null); title=$(playerctl metadata title 2>/dev/null); echo "󰎆 ${artist} - ${title}"; else echo ""; fi
    color = rgba(255, 255, 255, 0.9)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, -110
    halign = center
    valign = center
}

# --- Battery Status (Bottom Right Corner) ---
label {
    monitor =
    text = cmd[update:30000] capacity=$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null || echo "100"); status=$(cat /sys/class/power_supply/BAT*/status 2>/dev/null || echo "Discharging"); if [ "$status" = "Charging" ]; then echo " $capacity%"; else echo "󰁹 $capacity%"; fi
    color = rgba(255, 255, 255, 1.0)
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = -30, 30
    halign = right
    valign = bottom
}

# --- Network Status (Bottom Right Corner with SSID) ---
label {
    monitor =
    text = cmd[update:10000] ssid=$(nmcli -t -f active,ssid dev wifi 2>/dev/null | grep '^yes' | cut -d: -f2); if [ -n "$ssid" ]; then echo "  $ssid"; else echo "󰖪 Disconnected"; fi
    color = rgba(255, 255, 255, 1.0)
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = -30, 60
    halign = right
    valign = bottom
}

# --- Bluetooth Status (Bottom Right Corner) ---
label {
    monitor =
    text = cmd[update:10000] if bluetoothctl show 2>/dev/null | grep -q "Powered: yes"; then devices=$(bluetoothctl devices Connected 2>/dev/null | wc -l); if [ "$devices" -gt 0 ]; then echo "󰂱 Connected ($devices)"; else echo "󰂯 On"; fi; else echo "󰂲 Off"; fi
    color = rgba(255, 255, 255, 1.0)
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = -30, 90
    halign = right
    valign = bottom
}

# --- Notification Status (Bottom Right Corner - handles dunst/mako/swaync) ---
label {
    monitor =
    text = cmd[update:5000] if command -v swaync-client &>/dev/null; then dnd=$(swaync-client -D 2>/dev/null); if [ "$dnd" = "true" ]; then echo "󰂛 DND"; else count=$(swaync-client -c 2>/dev/null); echo "󰂚 $count"; fi; elif command -v dunstctl &>/dev/null; then if dunstctl is-paused | grep -q "true"; then echo "󰂛 DND"; else echo "󰂚 Notifications"; fi; else echo ""; fi
    color = rgba(255, 255, 255, 1.0)
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = -30, 120
    halign = right
    valign = bottom
}

# --- Password Input Field ---
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.26
    dots_spacing = 0.64
    dots_center = true
    dots_rounding = -1
    rounding = 22
    
    outer_color = $accent
    inner_color = rgba(0, 0, 0, 0.3)
    font_color = rgba(255, 255, 255, 1.0)
    fade_on_empty = true
    placeholder_text = <tt> </tt>
    position = 0, 120
    halign = center
    valign = bottom
}