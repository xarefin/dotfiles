# --- General ---
general {
    grace = 1
    fractional_scaling = 2
    immediate_render = true
}

# --- Background ---
background {
    monitor =
    # Set your wallpaper path here:
    path = /home/arefin/.cache/log.png

    color = rgb(0,0,0)   # fallback color while loading

    blur_size = 3
    blur_passes = 2
    noise = 0.0117
    contrast = 1.3000
    brightness = 0.6000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}

# --- Time (Hours) - 12-hour format ---
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%I") </big></b>"   # Changed %H to %I
    color = #ffffff
    font_size = 112
    font_family = Adwaita Sans
    shadow_passes = 0
    shadow_size = 0
    position = 0, 220
    halign = center
    valign = center
}

# --- Time (Minutes) ---
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%M") </big></b>"
    color = #ffffff
    font_size = 112
    font_family = Adwaita Sans
    shadow_passes = 0
    shadow_size = 0
    position = 0, 80
    halign = center
    valign = center
}

# --- Today (Day of week) ---
label {
    monitor =
    text = cmd[update:18000000] echo "<b><big> "$(date +'%A')" </big></b>"
    color = #aaaaaa
    font_size = 18
    font_family = JetBrainsMono NFM
    position = 0, -15
    halign = center
    valign = center
}

# --- Week (Date) ---
label {
    monitor =
    text = cmd[update:18000000] echo "<b> "$(date +'%d %b')" </b>"
    color = #aaaaaa
    font_size = 14
    font_family = JetBrainsMono Nerd Font 10
    position = 0, -40
    halign = center
    valign = center
}

