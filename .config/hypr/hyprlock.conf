# --- Password Input Field ---
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.26
    dots_spacing = 0.64
    dots_center = true
    dots_rouding = -1
    rounding = 22
    outer_color = #aaaaaa
    inner_color = rgba(0, 0, 0, 0.3)   # darker background to make white dots pop
    font_color = rgba(255, 255, 255, 1.0)   # pure white dots
    fade_on_empty = true
    placeholder_text = <tt> </tt>
    position = 0, 120
    halign = center
    valign = bottom
}

